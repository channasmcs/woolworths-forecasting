[project]
name = "woolworths-forecast"
version = "1.0.0"
description = "Demand forecasting pipeline comparing ARIMA vs XGBoost on M5 retail data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Channa Bandara" },
]
keywords = ["data-engineering", "machine-learning", "forecasting", "streamlit", "xgboost", "shap"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "shap>=0.44.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.7.0",
]

[project.urls]
"Repository" = "https://github.com/yourname/woolworths-forecast"
"Documentation" = "https://github.com/yourname/woolworths-forecast/blob/main/docs/"

# ===========================================================================
# RUFF — fast linter + formatter
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data/", "venv/", ".venv/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line too long — handled by formatter
    "S101",  # assert use — fine in tests
    "S301",  # pickle use — required for ML models
    "T201",  # print statement — allowed in scripts
    "C408",  # dict() literal — Plotly convention prefers this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert allowed in tests
"app.py" = ["E402"]  # late import after st.set_page_config is fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===========================================================================
# PYTEST
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ===========================================================================
# MYPY
# ===========================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Loose for now — tighten later
ignore_missing_imports = true
exclude = ["tests/", "venv/", ".venv/"]

[tool.coverage.run]
omit = ["tests/*", "src/styles.py", "src/__init__.py"]
